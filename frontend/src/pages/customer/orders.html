<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreshMart — My Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── navbar ── */
    .top-nav { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 0.75rem 2rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .logo-block { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; flex-shrink: 0; }
    .logo-icon { width: 42px; height: 42px; background: #2e7d32; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .logo-text strong { display: block; font-size: 1.05rem; color: #1a1a1a; line-height: 1.1; }
    .logo-text span { font-size: 0.72rem; color: #888; }
    .search-bar { flex: 1; max-width: 580px; display: flex; align-items: center; border: 1.5px solid #ddd; border-radius: 8px; padding: 0.45rem 0.9rem; gap: 0.5rem; }
    .search-bar input { border: none; outline: none; font-size: 0.9rem; color: #333; width: 100%; font-family: 'Inter', sans-serif; }
    .search-bar input::placeholder { color: #aaa; }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
    .btn-login-nav { background: none; border: none; font-size: 0.9rem; color: #333; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; text-decoration: none; }
    .btn-login-nav:hover { color: #2e7d32; }
    .btn-signup-nav { background: #2e7d32; color: #fff; border: none; border-radius: 8px; padding: 0.45rem 1.1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none; transition: background 0.15s; }
    .btn-signup-nav:hover { background: #1b5e20; color: #fff; }
    .cart-btn-wrap { position: relative; }
    .cart-btn { background: #2e7d32; color: #fff; border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; text-decoration: none; transition: background 0.15s; }
    .cart-btn:hover { background: #1b5e20; }
    .cart-badge { position: absolute; top: -6px; right: -6px; background: #e53935; color: #fff; border-radius: 50%; font-size: 0.65rem; font-weight: 700; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

    /* ── secondary nav ── */
    .sub-nav { background: #fff; border-bottom: 1px solid #e5e5e5; padding: 0 2rem; display: flex; gap: 0.25rem; overflow-x: auto; }
    .sub-nav a { text-decoration: none; font-size: 0.9rem; font-weight: 500; color: #555; padding: 0.65rem 1rem; border-bottom: 2px solid transparent; transition: color 0.15s; white-space: nowrap; }
    .sub-nav a:hover { color: #2e7d32; }
    .sub-nav a.active { color: #2e7d32; border-bottom-color: #2e7d32; }

    /* ── page layout ── */
    .page-wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; flex: 1; width: 100%; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .page-title { font-size: 1.6rem; font-weight: 700; }
    .page-subtitle { font-size: 0.875rem; color: #888; margin-top: 0.2rem; }

    /* ── filter tabs ── */
    .filter-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-tab { background: #fff; border: 1.5px solid #ddd; border-radius: 999px; padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 500; color: #555; cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; }
    .filter-tab:hover { border-color: #2e7d32; color: #2e7d32; }
    .filter-tab.active { background: #2e7d32; border-color: #2e7d32; color: #fff; }

    /* ── order card ── */
    .order-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 1rem; overflow: hidden; transition: box-shadow 0.15s; animation: fadeUp 0.35s ease both; }
    .order-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); }

    /* order card header */
    .order-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.25rem; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
    .order-id   { font-size: 0.95rem; font-weight: 700; color: #1a1a1a; }
    .order-date { font-size: 0.82rem; color: #888; }
    .order-total { font-size: 0.95rem; font-weight: 700; color: #1a1a1a; margin-left: auto; }

    /* status pills */
    .status-pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.7rem; border-radius: 999px; white-space: nowrap; }
    .status-delivered  { background: #e8f5e9; color: #2e7d32; }
    .status-shipped    { background: #e3f2fd; color: #1565c0; }
    .status-processing { background: #fff8e1; color: #f57f17; }
    .status-cancelled  { background: #fdecea; color: #c62828; }

    /* order items */
    .order-items { padding: 1rem 1.25rem; display: flex; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; }
    .order-item  { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .item-emoji  { width: 40px; height: 40px; background: #f5f5f5; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
    .item-detail { min-width: 0; }
    .item-name   { font-size: 0.8rem; font-weight: 600; color: #1a1a1a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
    .item-qty    { font-size: 0.7rem; color: #888; }

    /* progress bar */
    .progress-wrap { padding: 0 1.25rem 0.85rem; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.68rem; color: #aaa; margin-bottom: 0.35rem; }
    .progress-bar-bg   { height: 5px; background: #e5e5e5; border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 999px; background: #2e7d32; transition: width 0.4s; }

    /* order footer */
    .order-footer { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; background: #fafafa; border-top: 1px solid #f0f0f0; gap: 0.75rem; flex-wrap: wrap; }
    .tracking-info { font-size: 0.78rem; color: #888; display: flex; align-items: center; gap: 0.35rem; flex: 1; min-width: 0; }
    .order-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .btn-view    { background: #fff; border: 1.5px solid #ddd; border-radius: 8px; padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 500; color: #333; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; text-decoration: none; }
    .btn-view:hover { border-color: #2e7d32; color: #2e7d32; }
    .btn-reorder { background: #2e7d32; border: none; border-radius: 8px; padding: 0.35rem 0.8rem; font-size: 0.8rem; font-weight: 600; color: #fff; cursor: pointer; font-family: 'Inter', sans-serif; transition: background 0.15s; }
    .btn-reorder:hover { background: #1b5e20; }

    /* empty state */
    .empty-state { text-align: center; padding: 4rem 2rem; }
    .empty-state h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .empty-state p  { font-size: 0.875rem; color: #888; margin-bottom: 1.5rem; }
    .btn-shop { background: #2e7d32; color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.5rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.15s; }
    .btn-shop:hover { background: #1b5e20; color: #fff; }

    /* ── modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.show { display: flex; }
    .modal-card { background: #fff; border-radius: 16px; padding: 1.5rem; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .modal-title { font-size: 1.05rem; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #888; padding: 0.25rem; border-radius: 6px; transition: background 0.15s; }
    .modal-close:hover { background: #f5f5f5; }
    .modal-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; font-size: 0.875rem; color: #555; padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; }
    .modal-row:last-child { border-bottom: none; }
    .modal-row strong { color: #1a1a1a; text-align: right; }
    .modal-section { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #aaa; margin: 1rem 0 0.5rem; }
    .modal-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid #f5f5f5; }
    .modal-item:last-child { border-bottom: none; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn  { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    /* ── fix #66: responsive breakpoints ── */
    @media (max-width: 768px) {
      .top-nav { padding: 0.65rem 1rem; gap: 0.6rem; }
      .top-nav .search-bar { display: none; } /* hide search on mobile — too cramped */
      .page-wrap { padding: 1.25rem 1rem; }
      .page-title { font-size: 1.3rem; }

      /* order header stacks on mobile */
      .order-header { gap: 0.5rem; }
      .order-total { width: 100%; margin-left: 0; font-size: 1rem; }

      /* items scroll horizontally if too many */
      .order-items { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
      .order-item { flex-shrink: 0; }
      .item-name { max-width: 100px; }

      /* footer stacks vertically */
      .order-footer { flex-direction: column; align-items: flex-start; }
      .order-actions { width: 100%; }
      .btn-view, .btn-reorder { flex: 1; text-align: center; }

      /* filter tabs scroll horizontally */
      .filter-tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.25rem; -webkit-overflow-scrolling: touch; }
      .filter-tab { flex-shrink: 0; }

      /* modal takes full width on mobile */
      .modal-card { padding: 1.25rem; border-radius: 12px; }
      .modal-row { flex-direction: column; gap: 0.25rem; }
      .modal-row strong { text-align: left; }
    }

    @media (max-width: 480px) {
      .top-nav { padding: 0.5rem 0.75rem; }
      .logo-text span { display: none; } /* hide "Online Supermarket" tagline on tiny screens */
      .nav-actions gap { gap: 0.4rem; }
      .page-wrap { padding: 1rem 0.75rem; }


    @media (max-width: 360px) {
      .top-nav { padding: 0.5rem 0.5rem; gap: 0.3rem; }
      .btn-signup-nav { display: none; }
      .page-title { font-size: 1.1rem; }
      .filter-tab { font-size: 0.75rem; padding: 0.35rem 0.75rem; }
      .order-id { font-size: 0.85rem; }
      .btn-view, .btn-reorder { font-size: 0.75rem; padding: 0.3rem 0.6rem; }
    }

      /* progress labels — only show first and last on tiny screens */
      .progress-label span:nth-child(2),
      .progress-label span:nth-child(3) { display: none; }

      /* order id and date on same line */
      .order-header { padding: 0.85rem 1rem; }
      .order-items  { padding: 0.75rem 1rem; }
      .order-footer { padding: 0.65rem 1rem; }
      .progress-wrap { padding: 0 1rem 0.75rem; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="../../../index.html" class="logo-block">
      <div class="logo-icon">🛒</div>
      <div class="logo-text"><strong>FreshMart</strong><span>Online Supermarket</span></div>
    </a>
    <div class="search-bar">
      <input type="text" placeholder="Search for products..." id="searchInput" onkeydown="if(event.key==='Enter') searchRedirect()">
      <button onclick="searchRedirect()" style="background:none;border:none;cursor:pointer;font-size:1rem;color:#aaa;padding:0;">🔍</button>
    </div>
    <div class="nav-actions">
      <a href="login.html"  id="nav-login"  class="btn-login-nav">Login</a>
      <a href="signup.html" id="nav-signup" class="btn-signup-nav">Sign Up</a>
      <div id="nav-user" style="display:none;align-items:center;gap:0.5rem;">
        <span id="nav-username" style="font-size:0.9rem;font-weight:600;color:#1a1a1a;"></span>
        <button onclick="logout()" style="background:#f5f5f5;border:1.5px solid #ddd;border-radius:8px;padding:0.4rem 0.85rem;font-family:'Inter',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;color:#e53935;">Logout</button>
      </div>
      <button style="background:none;border:none;font-size:1.2rem;cursor:pointer">🤍</button>
      <button style="background:none;border:none;font-size:0.85rem;color:#333;cursor:pointer;font-family:'Inter',sans-serif">🎁 Orders</button>
      <div class="cart-btn-wrap">
        <a href="basket.html" class="cart-btn">🛒</a>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>
  </nav>

  <div class="sub-nav">
    <a href="index.html">Shop</a>
    <a href="products.html">Offers</a>
    <a href="products.html">Categories</a>
    <a href="orders.html" class="active">Orders</a>
  </div>

  <div class="page-wrap">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Orders</h1>
        <p class="page-subtitle" id="orderCountLabel">Loading...</p>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all', this)">All Orders</button>
      <button class="filter-tab" onclick="setFilter('processing', this)">⏳ Processing</button>
      <button class="filter-tab" onclick="setFilter('shipped', this)">🚚 Shipped</button>
      <button class="filter-tab" onclick="setFilter('delivered', this)">✅ Delivered</button>
      <button class="filter-tab" onclick="setFilter('cancelled', this)">❌ Cancelled</button>
    </div>

    <div id="ordersContainer"></div>
  </div>

  <!-- order detail modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Order Details</span>
        <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('show')">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* sample orders — replace with fetch('/api/orders') once backend OrderController is ready */
    const ORDERS = [
      {
        id: '#FM-3821', date: '22 Mar 2026', status: 'delivered', total: 24.50, delivery: 'Standard',
        address: '14 Maple Avenue, London, EC1A 1BB', payment: 'Credit Card',
        items: [
          { emoji:'🍎', name:'Gala Apples', qty:2, price:2.49 },
          { emoji:'🧀', name:'Cheddar Cheese', qty:1, price:3.49 },
          { emoji:'🍗', name:'Chicken Breast', qty:3, price:4.99 }
        ],
        progress: 100, tracking: 'Delivered on 24 Mar 2026'
      },
      {
        id: '#FM-3756', date: '18 Mar 2026', status: 'shipped', total: 16.30, delivery: 'Next Day',
        address: '14 Maple Avenue, London, EC1A 1BB', payment: 'PayPal',
        items: [
          { emoji:'🍞', name:'Sourdough Loaf', qty:2, price:2.49 },
          { emoji:'🥛', name:'Whole Milk', qty:3, price:1.45 }
        ],
        progress: 65, tracking: 'Out for delivery — Est. arrival 20 Mar 2026'
      },
      {
        id: '#FM-3701', date: '14 Mar 2026', status: 'delivered', total: 41.80, delivery: 'Standard',
        address: '14 Maple Avenue, London, EC1A 1BB', payment: 'Credit Card',
        items: [
          { emoji:'🍫', name:'Protein Bar Variety Pack', qty:2, price:21.99 },
          { emoji:'🥚', name:'Free Range Eggs', qty:1, price:2.79 }
        ],
        progress: 100, tracking: 'Delivered on 16 Mar 2026'
      },
      {
        id: '#FM-3644', date: '09 Mar 2026', status: 'processing', total: 9.20, delivery: 'Standard',
        address: '14 Maple Avenue, London, EC1A 1BB', payment: 'Credit Card',
        items: [
          { emoji:'🍓', name:'Strawberries', qty:2, price:3.49 },
          { emoji:'🥦', name:'Broccoli', qty:2, price:0.89 }
        ],
        progress: 20, tracking: 'Order confirmed — being prepared'
      },
      {
        id: '#FM-3590', date: '04 Mar 2026', status: 'cancelled', total: 13.45, delivery: 'Next Day',
        address: '14 Maple Avenue, London, EC1A 1BB', payment: 'Credit Card',
        items: [
          { emoji:'🍌', name:'Ripe Bananas', qty:3, price:1.29 },
          { emoji:'🧀', name:'Cheddar Cheese', qty:2, price:3.49 }
        ],
        progress: 0, tracking: 'Order cancelled on 04 Mar 2026'
      },
    ];

    let activeFilter = 'all';

    const STATUS = {
      delivered:  { emoji: '✅', label: 'Delivered',  cls: 'status-delivered'  },
      shipped:    { emoji: '🚚', label: 'Shipped',    cls: 'status-shipped'    },
      processing: { emoji: '⏳', label: 'Processing', cls: 'status-processing' },
      cancelled:  { emoji: '❌', label: 'Cancelled',  cls: 'status-cancelled'  },
    };

    function setFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const filtered  = activeFilter === 'all' ? ORDERS : ORDERS.filter(o => o.status === activeFilter);
      const container = document.getElementById('ordersContainer');
      document.getElementById('orderCountLabel').textContent =
        `${filtered.length} order${filtered.length !== 1 ? 's' : ''} found`;

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">
          <div style="font-size:3rem;margin-bottom:1rem">📦</div>
          <h3>No orders found</h3>
          <p>You have no ${activeFilter === 'all' ? '' : activeFilter + ' '}orders yet.</p>
          <a href="products.html" class="btn-shop">Start Shopping</a>
        </div>`;
        return;
      }

      container.innerHTML = filtered.map((o, i) => {
        const s = STATUS[o.status];
        const showProgress = o.status === 'shipped' || o.status === 'processing';
        const progressHtml = showProgress ? `
          <div class="progress-wrap">
            <div class="progress-label">
              <span>Placed</span><span>Preparing</span><span>Shipped</span><span>Delivered</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${o.progress}%"></div>
            </div>
          </div>` : '';

        return `<div class="order-card" style="animation-delay:${i*0.06}s">
          <div class="order-header">
            <div>
              <div class="order-id">${o.id}</div>
              <div class="order-date">${o.date}</div>
            </div>
            <span class="status-pill ${s.cls}">${s.emoji} ${s.label}</span>
            <div class="order-total">£${o.total.toFixed(2)}</div>
          </div>
          <div class="order-items">
            ${o.items.map(item => `
              <div class="order-item">
                <div class="item-emoji">${item.emoji}</div>
                <div class="item-detail">
                  <div class="item-name">${item.name}</div>
                  <div class="item-qty">Qty: ${item.qty}</div>
                </div>
              </div>`).join('')}
          </div>
          ${progressHtml}
          <div class="order-footer">
            <div class="tracking-info">📍 ${o.tracking}</div>
            <div class="order-actions">
              <button class="btn-view" onclick="openModal(${ORDERS.indexOf(o)})">View Details</button>
              ${o.status !== 'cancelled'
                ? `<button class="btn-reorder" onclick="reorder(${ORDERS.indexOf(o)})">Reorder</button>`
                : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function openModal(index) {
      const o = ORDERS[index];
      const s = STATUS[o.status];
      document.getElementById('modalTitle').textContent = `Order ${o.id}`;
      document.getElementById('modalBody').innerHTML = `
        <div class="modal-section">Order Info</div>
        <div class="modal-row"><span>Date</span><strong>${o.date}</strong></div>
        <div class="modal-row"><span>Status</span><span class="status-pill ${s.cls}">${s.emoji} ${s.label}</span></div>
        <div class="modal-row"><span>Delivery</span><strong>${o.delivery}</strong></div>
        <div class="modal-row"><span>Payment</span><strong>${o.payment}</strong></div>
        <div class="modal-row"><span>Address</span><strong>${o.address}</strong></div>
        <div class="modal-section">Items</div>
        ${o.items.map(item => `
          <div class="modal-item">
            <div style="font-size:1.5rem;width:36px;height:36px;background:#f5f5f5;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${item.emoji}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>
              <div style="font-size:0.75rem;color:#888">Qty: ${item.qty}</div>
            </div>
            <div style="font-size:0.875rem;font-weight:700;flex-shrink:0">£${(item.price * item.qty).toFixed(2)}</div>
          </div>`).join('')}
        <div class="modal-section">Total</div>
        <div class="modal-row"><span>Order Total</span><strong style="color:#2e7d32;font-size:1rem">£${o.total.toFixed(2)}</strong></div>`;
      document.getElementById('modalOverlay').classList.add('show');
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay'))
        document.getElementById('modalOverlay').classList.remove('show');
    }

    /* reorder adds items back to basket with their metadata */
    function reorder(index) {
      const o = ORDERS[index];
      const basket = JSON.parse(localStorage.getItem('fm_basket') || '{}');
      const meta   = JSON.parse(localStorage.getItem('fm_basket_meta') || '{}');
      o.items.forEach((item, i) => {
        const id = `reorder_${index}_${i}`;
        basket[id] = (basket[id] || 0) + item.qty;
        meta[id]   = { id, name: item.name, price: item.price, emoji: item.emoji };
      });
      localStorage.setItem('fm_basket', JSON.stringify(basket));
      localStorage.setItem('fm_basket_meta', JSON.stringify(meta));
      window.location.href = 'basket.html';
    }

    function updateNavAuth() {
      const user = JSON.parse(localStorage.getItem('fm_user') || sessionStorage.getItem('fm_user') || 'null');
      const loginBtn  = document.getElementById('nav-login');
      const signupBtn = document.getElementById('nav-signup');
      const userInfo  = document.getElementById('nav-user');
      if (user) {
        if (loginBtn)  loginBtn.style.display  = 'none';
        if (signupBtn) signupBtn.style.display = 'none';
        if (userInfo)  { userInfo.style.display = 'flex'; document.getElementById('nav-username').textContent = `👤 ${user.name || user.email}`; }
      } else {
        if (loginBtn)  loginBtn.style.display  = '';
        if (signupBtn) signupBtn.style.display = '';
        if (userInfo)  userInfo.style.display  = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('fm_user');
      sessionStorage.removeItem('fm_user');
      localStorage.removeItem('fm_basket');
      window.location.href = 'login.html';
    }

    function updateCartBadge() {
      const b = JSON.parse(localStorage.getItem('fm_basket') || '{}');
      document.getElementById('cartBadge').textContent = Object.values(b).reduce((s, v) => s + v, 0);
    }

    render();
    updateNavAuth();
    updateCartBadge();

    
    function searchRedirect() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) window.location.href = 'products.html?q=' + encodeURIComponent(q);
    }
  
  </script>
</body>
</html>
